<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Facturas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('facturas')}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h1 class="page-title h3 mb-0">Facturas</h1>
        <div class="card stat-card dinero shadow-sm">
            <div class="card-body py-2">
                <span class="text-muted small">Total facturado</span>
                <span class="fw-bold ms-2" th:text="${'$ ' + #numbers.formatDecimal(total, 1, 'POINT', 0, 'COMMA')}">$ 0</span>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Factura</th>
                    <th>Registro</th>
                    <th>Fecha de pago</th>
                    <th>Método</th>
                    <th class="text-end">Valor</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="f : ${facturas}">
                    <td class="fw-semibold" th:text="${'#' + f.idFactura}">#1</td>
                    <td th:text="${f.idRegistro}">1</td>
                    <td th:text="${f.fechaPago != null ? #temporals.format(f.fechaPago, 'dd/MM/yyyy HH:mm') : '-'}">21/11/2026</td>
                    <td class="text-capitalize" th:text="${f.metodoPago}">efectivo</td>
                    <td class="text-end fw-semibold" th:text="${f.valorTotal != null ? '$ ' + #numbers.formatDecimal(f.valorTotal, 1, 'POINT', 0, 'COMMA') : '-'}">$ 3.000</td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/facturas/{id}(id=${f.idFactura})}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-eye"></i> Ver</a>
                        <form th:action="@{/facturas/{id}/eliminar(id=${f.idFactura})}" method="post" class="d-inline"
                              onsubmit="return confirm('¿Eliminar esta factura?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${facturas.isEmpty()}">
                    <td colspan="6" class="text-center text-muted py-4">
                        No hay facturas. Se generan al registrar la salida de un vehículo.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('clientes')}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="page-title h3 mb-0">Clientes</h1>
        <a th:href="@{/clientes/nuevo}" class="btn btn-primary"><i class="bi bi-person-plus"></i> Nuevo cliente</a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Documento</th>
                    <th>Nombre</th>
                    <th>Teléfono</th>
                    <th>Email</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${clientes}">
                    <td th:text="${c.documento}">1000111222</td>
                    <td th:text="${c.nombre + ' ' + c.apellido}">Ana Pérez</td>
                    <td th:text="${c.telefono}">3001234567</td>
                    <td th:text="${c.email}">ana@mail.com</td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/clientes/{id}/editar(id=${c.idCliente})}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil"></i> Editar</a>
                        <form th:action="@{/clientes/{id}/eliminar(id=${c.idCliente})}" method="post" class="d-inline"
                              onsubmit="return confirm('¿Eliminar este cliente?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${clientes.isEmpty()}">
                    <td colspan="5" class="text-center text-muted py-4">No hay clientes registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>

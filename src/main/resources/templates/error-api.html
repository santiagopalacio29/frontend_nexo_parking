<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('')}"></nav>

<main class="container py-5" style="max-width: 720px">
    <div class="card shadow-sm border-danger">
        <div class="card-body p-4 text-center">
            <i class="bi bi-plug text-danger" style="font-size: 3rem"></i>
            <h1 class="h4 mt-3">No se pudo cargar la información</h1>
            <p class="text-muted" th:text="${mensaje}">Mensaje de error</p>
            <p class="small text-muted" th:if="${estado != null and estado > 0}" th:text="'Código HTTP del backend: ' + ${estado}">HTTP 500</p>
            <p class="small text-muted text-break" th:if="${url != null}">URL consultada: <code th:text="${url}">http://localhost:8080/api</code></p>
            <a th:href="@{/}" class="btn btn-primary">Volver al panel</a>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>

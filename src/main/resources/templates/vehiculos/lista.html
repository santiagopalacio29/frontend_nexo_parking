<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Vehículos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('vehiculos')}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="page-title h3 mb-0">Vehículos</h1>
        <a th:href="@{/vehiculos/nuevo}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nuevo vehículo</a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Placa</th>
                    <th>Tipo</th>
                    <th>Marca</th>
                    <th>Color</th>
                    <th>Documento del propietario</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="v : ${vehiculos}">
                    <td><span class="placa" th:text="${v.placa}">ABC123</span></td>
                    <td class="text-capitalize" th:text="${v.tipoVehiculo}">carro</td>
                    <td th:text="${v.marca}">Mazda</td>
                    <td th:text="${v.color}">Rojo</td>
                    <td th:text="${v.documentoCliente}">1000111222</td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/vehiculos/{placa}/editar(placa=${v.placa})}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil"></i> Editar</a>
                        <form th:action="@{/vehiculos/{placa}/eliminar(placa=${v.placa})}" method="post" class="d-inline"
                              onsubmit="return confirm('¿Eliminar este vehículo?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${vehiculos.isEmpty()}">
                    <td colspan="6" class="text-center text-muted py-4">No hay vehículos registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>

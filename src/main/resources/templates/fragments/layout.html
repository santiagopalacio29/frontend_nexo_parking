<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">


<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Nexo Parking'">Nexo Parking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body>

<nav th:fragment="navbar(activo)" class="navbar navbar-expand-lg navbar-dark nexo-navbar">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
            <span class="nexo-logo">P</span> Nexo Parking
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'inicio'} ? 'active'" th:href="@{/}">
                    <i class="bi bi-speedometer2"></i> Panel</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'parqueo'} ? 'active'" th:href="@{/parqueo}">
                    <i class="bi bi-arrow-left-right"></i> Entradas y salidas</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'espacios'} ? 'active'" th:href="@{/espacios}">
                    <i class="bi bi-grid-3x3-gap"></i> Espacios</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'vehiculos'} ? 'active'" th:href="@{/vehiculos}">
                    <i class="bi bi-car-front"></i> Vehículos</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'clientes'} ? 'active'" th:href="@{/clientes}">
                    <i class="bi bi-people"></i> Clientes</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'tarifas'} ? 'active'" th:href="@{/tarifas}">
                    <i class="bi bi-cash-coin"></i> Tarifas</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'facturas'} ? 'active'" th:href="@{/facturas}">
                    <i class="bi bi-receipt"></i> Facturas</a></li>
            </ul>
        </div>
    </div>
</nav>

<div th:fragment="alertas">
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${exito}">Operación exitosa</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${error}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
</div>

<th:block th:fragment="footer">
    <footer class="text-center text-muted small py-4">
        Santiago Palacio - Andres Felipe Gaviria - Jeronimo Villa
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Espacios')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('espacios')}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="page-title h3 mb-0">Espacios</h1>
        <a th:href="@{/espacios/nuevo}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nuevo espacio</a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Número</th>
                    <th>Nivel</th>
                    <th>Tipo</th>
                    <th>Estado</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${espacios}" th:with="placa=${placaPorEspacio[e.idEspacio]}">
                    <td class="fw-semibold" th:text="${e.numeroEspacio}">1</td>
                    <td th:text="${e.nivel}">1</td>
                    <td class="text-capitalize" th:text="${e.tipoEspacio}">carro</td>
                    <td>
                        <span th:if="${e.disponible}" class="badge text-bg-success">Libre</span>
                        <span th:if="${!e.disponible and placa != null}" class="badge text-bg-danger">
                            Ocupado por <span th:text="${placa}">ABC123</span></span>
                        <span th:if="${!e.disponible and placa == null}" class="badge text-bg-secondary">No disponible</span>
                    </td>
                    <td class="text-end">
                        <form th:if="${placa == null}" th:action="@{/espacios/{id}/estado(id=${e.idEspacio})}" method="post" class="d-inline">
                            <input type="hidden" name="disponible" th:value="${!e.disponible}">
                            <button type="submit" class="btn btn-sm"
                                    th:classappend="${e.disponible} ? 'btn-outline-secondary' : 'btn-outline-success'"
                                    th:text="${e.disponible} ? 'Marcar no disponible' : 'Habilitar'">Cambiar</button>
                        </form>
                        <a th:if="${placa != null}" th:href="@{/parqueo}" class="btn btn-sm btn-outline-danger">Registrar salida</a>
                    </td>
                </tr>
                <tr th:if="${espacios.isEmpty()}">
                    <td colspan="5" class="text-center text-muted py-4">No hay espacios registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>

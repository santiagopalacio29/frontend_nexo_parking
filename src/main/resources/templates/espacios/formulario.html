<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nuevo espacio')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('espacios')}"></nav>

<main class="container py-4" style="max-width: 760px">
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <h1 class="page-title h3 mb-3">Nuevo espacio</h1>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/espacios/guardar}" th:object="${espacio}" method="post" class="row g-3">
                <div class="col-md-3">
                    <label for="idEspacio" class="form-label">ID *</label>
                    <input type="number" id="idEspacio" th:field="*{idEspacio}" class="form-control" min="1" required>
                </div>
                <div class="col-md-3">
                    <label for="numeroEspacio" class="form-label">Número *</label>
                    <input type="number" id="numeroEspacio" th:field="*{numeroEspacio}" class="form-control" min="1" required>
                </div>
                <div class="col-md-3">
                    <label for="nivel" class="form-label">Nivel *</label>
                    <input type="number" id="nivel" th:field="*{nivel}" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label for="tipoEspacio" class="form-label">Tipo *</label>
                    <select id="tipoEspacio" th:field="*{tipoEspacio}" class="form-select" required>
                        <option value="">Selecciona…</option>
                        <option th:each="t : ${tarifas}" th:value="${t.tipoVehiculo}" th:text="${t.tipoVehiculo}">carro</option>
                    </select>
                </div>
                <div class="col-12 form-text mt-0">El ID y el número se sugieren automáticamente. El espacio se crea libre.</div>

                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Guardar</button>
                    <a th:href="@{/espacios}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
